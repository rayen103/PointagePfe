<div class="w-full h-full relative bg-gray-50 dark:bg-gray-950 overflow-hidden">
    <!-- Floating Map Controls (Top Left) -->
    <div class="absolute top-4 left-4 z-[999] flex gap-2">
        <button class="px-4 py-1.5 rounded-full text-xs font-bold shadow-sm transition-all bg-[#121242] text-white flex items-center gap-1.5" type="button">
            <span class="w-1.5 h-1.5 rounded-full bg-green-400"></span>
            Temps réel
        </button>
        @if (showCircuitOverlay) {
            <button class="px-4 py-1.5 rounded-full text-xs font-bold shadow-sm transition-all bg-white hover:bg-gray-50 text-secondary border border-gray-200 dark:bg-gray-900 dark:border-gray-750 dark:text-gray-300" type="button">
                Circuits
            </button>
            <button class="px-4 py-1.5 rounded-full text-xs font-bold shadow-sm transition-all bg-white hover:bg-gray-50 text-secondary border border-gray-200 dark:bg-gray-900 dark:border-gray-750 dark:text-gray-300" type="button">
                Points de collecte
            </button>
        }
    </div>

    <!-- Floating Toggle for Show All (Tous) (Top Right) -->
    <div class="absolute top-4 right-4 z-[999] bg-white dark:bg-gray-900 px-3 py-1.5 rounded-full shadow-sm border border-gray-200 dark:border-gray-750 flex items-center gap-2">
        <span class="text-[11px] font-bold text-secondary">Tous</span>
        <mat-slide-toggle [color]="'primary'" [checked]="showAll" (change)="toggleShowAll.emit($event.checked)" class="scale-90"></mat-slide-toggle>
    </div>

    <!-- Route Info Overlay (Top Center) -->
    @if (optimizedRoute) {
        <div class="absolute top-4 left-1/2 -translate-x-1/2 z-[999] bg-white/90 dark:bg-gray-900/90 backdrop-blur px-4 py-2 rounded-full shadow-sm border border-gray-200 dark:border-gray-750 flex items-center gap-4 text-xs font-semibold">
            <span class="text-secondary">Distance</span>
            <span class="text-primary tabular-nums">{{ optimizedRoute.distanceKm ?? '—' }} km</span>
            <span class="w-px h-3 bg-gray-200 dark:bg-gray-700"></span>
            <span class="text-secondary">Durée</span>
            <span class="text-primary tabular-nums">{{ optimizedRoute.durationMinutes ?? '—' }} min</span>
            @if (routeLoading) {
                <mat-spinner diameter="16" mode="indeterminate" class="ml-1"></mat-spinner>
            }
        </div>
    }

    <!-- Map Viewport -->
    <div class="w-full h-full relative min-h-0">
        @if ((locations?.length ?? 0) === 0 && !showCircuitOverlay) {
            <div class="flex flex-col items-center justify-center gap-2 p-10 text-sm text-hint absolute inset-0 bg-white/70 dark:bg-gray-900/70">
                <mat-icon class="icon-size-10 opacity-30" [svgIcon]="'heroicons_outline:map'"></mat-icon>
                <span>Aucune position à afficher.</span>
            </div>
        } @else {
            <app-map-viewer
                [locations]="locations"
                [circuitPoints]="circuitPoints"
                [optimizedRoute]="optimizedRoute"
                [selectedBusPosition]="selectedBusPosition"
                [circuitArea]="circuitArea"
                [height]="'100%'"
                [zoom]="7"
                class="w-full h-full block">
            </app-map-viewer>
        }
    </div>
</div>

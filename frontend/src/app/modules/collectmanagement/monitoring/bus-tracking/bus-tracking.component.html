<div class="cst-supervision-page">
    @if (isLoading) {
        <mat-progress-bar mode="indeterminate" class="rounded-full flex-none absolute top-0 left-0 right-0 z-50 h-1"></mat-progress-bar>
    }

    <!-- Supervision Grid Card wrapper -->
    <div class="cst-supervision-grid bg-white dark:bg-gray-900 overflow-hidden grid grid-cols-1 lg:grid-cols-[320px_1fr_360px] h-full w-full">
        
        <!-- Left Column: Bus List -->
        <div class="h-full overflow-hidden">
            <app-bus-tracking-list
                [buses]="filteredBuses"
                [selectedBusId]="selectedBus?.busId ?? null"
                [isLoading]="isLoading"
                [searchControl]="searchInputControl"
                (selectBus)="onSelectBus($event)">
            </app-bus-tracking-list>
        </div>

        <!-- Middle Column: Live Map -->
        <div class="h-full border-l border-r border-gray-200 dark:border-gray-700 overflow-hidden">
            <app-bus-tracking-map
                [locations]="getMapLocations()"
                [showAll]="showAllOnMapControl.value === true"
                [circuitPoints]="CircuitPoints"
                [optimizedRoute]="OptimizedRouteForMap"
                [selectedBusPosition]="SelectedBusPosition"
                [routeLoading]="circuitLoading"
                (toggleShowAll)="onToggleShowAllOnMap($event)">
            </app-bus-tracking-map>
        </div>

        <!-- Right Column: Detail Panel -->
        <div class="h-full overflow-hidden">
            <app-bus-tracking-panel
                [bus]="selectedBus"
                [events]="selectedEvents"
                [eventsLoading]="selectedBusEventsLoading"
                [pointages]="selectedPointages"
                [pointagesLoading]="selectedBusPointagesLoading"
                [canEmptyBus]="hasActionPermission(FuseNavigationAction.Edit)"
                [circuitInfo]="circuitData ? {
                    circuitId: circuitData.circuitId,
                    circuitCode: circuitData.circuitCode,
                    circuitName: circuitData.circuitName,
                    completedPoints: completedCollectionPoints,
                    totalCollectionPoints: circuitData.collectionPoints.length,
                    progressPercent: routeProgressPercent,
                    nextDestinationName: nextDestinationName,
                    remainingDistanceKm: remainingDistanceKm,
                    remainingEtaMinutes: remainingEtaMinutes
                } : null"
                (emptyBus)="emptySelectedBus()">
            </app-bus-tracking-panel>
        </div>
    </div>
</div>

<!-- Loading bar -->
<fuse-loading-bar></fuse-loading-bar>

<!-- Navigation -->
@if (isScreenSmall) {
    <fuse-vertical-navigation
        class="dark bg-gray-900 print:hidden pb-4"
        [mode]="'over'"
        [name]="'mainNavigation'"
        [navigation]="navigation.default"
        [opened]="false"
    >
        <!-- Navigation header hook -->
        <ng-container fuseVerticalNavigationContentHeader>
            <!-- Logo -->
            <div class="flex h-20 items-center px-8 pt-6">
                <img
                    class="w-24"
                    src="images/logo/logo-text-on-dark.svg"
                    alt="Logo image"
                />
            </div>
        </ng-container>
        <div class="w-full p-4">

        </div>
    </fuse-vertical-navigation>
}

<!-- Wrapper -->
<div class="flex w-full min-w-0 flex-auto flex-col">
    <!-- Header -->
    <div
        class="bg-card relative z-49 flex h-16 w-full flex-0 items-center px-4 shadow dark:border-b dark:bg-transparent dark:shadow-none sm:h-20 md:px-6 print:hidden"
    >
        @if (!isScreenSmall) {
            <!-- Logo lockup (CST Design Canvas) -->
            <div class="cst-logo">
                <img class="cst-logo__mark" src="images/logo/cst-mark.svg" alt="CST" />
                <div class="cst-logo__text">
                    <div class="cst-logo__name">CST</div>
                    <div class="cst-logo__sub">CANADIAN SYSTEM TECHNOLOGY</div>
                </div>
            </div>
            <!-- Horizontal navigation -->
            <fuse-horizontal-navigation
                class="mr-2"
                [name]="'mainNavigation'"
                [navigation]="navigation.horizontal"
            ></fuse-horizontal-navigation>
        }
        <!-- Navigation toggle button -->
        @if (isScreenSmall) {
            <button
                mat-icon-button
                (click)="toggleNavigation('mainNavigation')"
            >
                <mat-icon [svgIcon]="'heroicons_outline:bars-3'"></mat-icon>
            </button>
        }
        <!-- Components (CST Design Canvas top-bar actions) -->
        <div class="cst-actions ml-auto flex items-center">
            <!-- Search -->
            <search [appearance]="'bar'"></search>

            <!-- Notifications -->
            <button type="button" class="cst-ic" aria-label="Notifications">
                <mat-icon class="icon-size-4" [svgIcon]="'heroicons_outline:bell'"></mat-icon>
                <span class="cst-ic__dot"></span>
            </button>

            <!-- Dark / light -->
            <button type="button" class="cst-ic" (click)="toggleScheme()" aria-label="Thème">
                <mat-icon class="icon-size-4" [svgIcon]="config.scheme === 'dark' ? 'heroicons_solid:sun' : 'heroicons_solid:moon'"></mat-icon>
            </button>

            <!-- Fullscreen -->
            <fuse-fullscreen class="cst-fs hidden md:block"></fuse-fullscreen>

            <!-- Language -->
            <languages class="cst-lang"></languages>

            <!-- User -->
            <user class="cst-user"></user>
        </div>
    </div>

    <!-- Content -->
    <div class="flex w-full flex-auto flex-col">
        <!-- *ngIf="true" hack is required here for router-outlet to work correctly.
             Otherwise, layout changes won't be registered and the view won't be updated! -->
        @if (true) {
            <router-outlet></router-outlet>
        }
    </div>

    <!-- Footer -->
<!--    <div-->
<!--        class="bg-card relative z-49 flex h-14 w-full flex-0 items-center border-t px-4 dark:bg-transparent sm:h-20 md:px-6 print:hidden"-->
<!--    >-->
<!--        <span class="text-secondary font-medium"-->
<!--            >Fuse &copy; {{ currentYear }}</span-->
<!--        >-->
<!--    </div>-->
</div>

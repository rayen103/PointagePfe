# ─────────────────────────────────────────────────────────────
# PointagePfe – Full-stack docker-compose
# Run:  docker-compose up --build
# Stop: docker-compose down
# ─────────────────────────────────────────────────────────────

services:

  # ── SQL Server ───────────────────────────────────────────────
  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      SA_PASSWORD: "@dmin123"
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P @dmin123 -Q \"SELECT 1\" -No || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P @dmin123 -Q \"SELECT 1\" -No"]
      interval: 10s
      retries: 10
      start_period: 30s

  # ── MQTT Broker ─────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

  # ── .NET Backend ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "6064:6064"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:6064"
      Mqtt__BrokerHost: mosquitto
      Mqtt__BrokerPort: 1883
      Mqtt__ClientId: BusTrackingBackend
      Mqtt__Username: ""
      Mqtt__Password: ""
      Mqtt__UseTls: "false"
      Mqtt__Topic: "TEmploc/+"
      Mqtt__ReconnectDelaySeconds: "5"
      ConnectionStrings__SqlServerConnection: >-
        Server=db,1433;Database=PointageBus;User Id=sa;
        Password=@dmin123;TrustServerCertificate=True
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started

  # ── Angular Frontend ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend

  # ─────────────── AI / ML micro-services ──────────────────────
  eta-prediction:
    build: ./ml-services/eta_prediction
    ports:
      - "8001:8000"
    volumes:
      - ./ml-services/eta_prediction/artifacts:/app/artifacts
    restart: unless-stopped

volumes:
  sqldata:

name: Deploy Backend to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'api-pointage-rayen'
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js (for Tailwind build)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install WebAPI Tailwind dependencies
        working-directory: backend/src/CollectManagement.ms/CollectManagement.WebAPI
        run: npm ci || npm install

      - name: Restore dependencies
        working-directory: backend
        run: dotnet restore CST.LePoint.sln

      - name: Publish .NET 8 WebAPI
        working-directory: backend/src/CollectManagement.ms/CollectManagement.WebAPI
        run: dotnet publish CollectManagement.WebAPI.csproj -c Release -o ${{ runner.temp }}/publish /p:UseAppHost=false

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND }}
          package: ${{ runner.temp }}/publish
